<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Signal lost · M-R-Z</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#05070b">
  <link rel="icon" href="/favicon.svg?v=56537ccc36" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css?v=94ea06bcf7">
  <style>
    .nf { min-height: 100svh; display: grid; place-items: center; padding: 48px 20px; position: relative; overflow: hidden; isolation: isolate; }
    .nf-box { position: relative; width: min(640px, 100%); padding: clamp(24px, 5vw, 44px); background: var(--panel); border: 1px solid var(--line-2); }
    .nf .ch-label { margin-bottom: 20px; }
    .nf-code { font-family: var(--f-display); font-size: clamp(84px, 18vw, 150px); font-weight: 700; line-height: .9; margin: 0 0 12px; color: var(--text); position: relative; display: inline-block; }
    .nf-code::before, .nf-code::after { content: "404"; position: absolute; inset: 0; opacity: .85; }
    .nf-code::before { color: var(--neon); transform: translate(-3px, 0); clip-path: inset(15% 0 60% 0); }
    .nf-code::after { color: var(--hot); transform: translate(3px, 0); clip-path: inset(62% 0 12% 0); }
    .nf h1 { font-family: var(--f-display); font-size: clamp(22px, 3.6vw, 30px); text-transform: uppercase; margin-bottom: 10px; }
    .nf p { color: var(--text-2); }
    .nf pre { margin: 18px 0 26px; padding: 14px 16px; background: rgba(0,0,0,.35); border: 1px solid var(--line); font-family: var(--f-mono); font-size: 12.5px; color: var(--text-2); white-space: pre-wrap; }
    .nf pre .ok { color: var(--neon); } .nf pre .hot { color: var(--hot); }
    .nf-actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .nf .fa { font-family: var(--f-fa); margin: 24px 0 0; font-size: 15px; }
    .nf .fa a { color: var(--neon); }
  </style>
</head>
<body>
  <div class="fx-scan" aria-hidden="true"></div>
  <main class="nf">
    <div class="hero-bg" aria-hidden="true"><div class="grid-plane"></div><div class="orb orb-a"></div><div class="orb orb-b"></div></div>
    <div class="nf-box">
      <div class="frame-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="ch-label"><span class="ch-num">ERR</span><span class="ch-line"></span><span class="ch-code">SIGNAL LOST</span><span class="ch-accent" lang="fa">سیگنال قطع شد</span></div>
      <p class="nf-code" aria-hidden="true">404</p>
      <h1>This route doesn't exist.</h1>
      <p>The link may be broken, or the page has moved. Return to base and try again.</p>
<pre aria-hidden="true"><span class="ok">mrzroot@mrz:~$</span> cd <span id="nf-path">/unknown</span>
<span class="hot">cd: no such file or directory</span>
<span class="ok">mrzroot@mrz:~$</span> cd ~ <span class="blink">_</span></pre>
      <div class="nf-actions">
        <a class="btn btn-neon" href="/">Return to base</a>
        <a class="btn btn-line" href="https://t.me/mrzroot" target="_blank" rel="noopener">Telegram</a>
      </div>
      <p class="fa" lang="fa" dir="rtl">صفحه‌ای که دنبالش هستید پیدا نشد. <a href="/">بازگشت به خانه</a></p>
    </div>
  </main>
  <script>(function(){var e=document.getElementById('nf-path');if(e)e.textContent=decodeURI(location.pathname).slice(0,60);})();</script>
</body>
</html>
