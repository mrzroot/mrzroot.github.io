<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Signal lost · M-R-Z</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07080a">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/favicon.svg?v=703500f17e" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css?v=b18a73b662">
  <style>
    .nf { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 48px var(--gutter); position: relative; isolation: isolate; overflow: hidden; }
    .nf::before { content: ""; position: absolute; inset: 0; z-index: -1; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size: 24px 24px; mask-image: radial-gradient(50% 50% at 50% 50%, #000, transparent); -webkit-mask-image: radial-gradient(50% 50% at 50% 50%, #000, transparent); }
    .nf-box { width: min(560px, 100%); padding: clamp(24px, 5vw, 40px); }
    .nf-code { font-size: clamp(5rem, 16vw, 8rem); font-weight: 650; letter-spacing: -.06em; line-height: 1; background: linear-gradient(180deg, #fff 20%, rgba(255,255,255,.25)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nf h1 { margin-top: 16px; font-size: 1.5rem; font-weight: 600; letter-spacing: -.02em; }
    .nf-box > p { margin-top: 8px; color: var(--text-2); }
    .nf pre { margin: 24px 0; padding: 16px; border-radius: var(--r-ctl); background: rgba(0,0,0,.3); box-shadow: inset 0 0 0 1px var(--line); font-family: var(--mono); font-size: .8125rem; color: var(--text-2); white-space: pre-wrap; word-break: break-all; }
    .nf pre b { font-weight: 400; color: var(--accent); }
    .nf pre i { font-style: normal; color: #f08a8a; }
    .nf-actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .nf .fa { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); font-family: 'Vazirmatn', sans-serif; font-size: .9375rem; color: var(--text-2); }
    .nf .fa a { color: var(--accent); }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf-box card">
      <p class="label"><span class="num">ERR</span><span>Signal lost</span></p>
      <p class="nf-code" aria-hidden="true">404</p>
      <h1>This route doesn't exist.</h1>
      <p>The link may be broken, or the page has moved.</p>
<pre aria-hidden="true"><b>mrz:~$</b> cd <span id="nf-path">/unknown</span>
<i>cd: no such file or directory</i>
<b>mrz:~$</b> cd ~</pre>
      <div class="nf-actions">
        <a class="btn btn-primary" href="/">Back to home</a>
        <a class="btn btn-ghost" href="https://t.me/mrzroot" target="_blank" rel="noopener">Telegram</a>
      </div>
      <p class="fa" lang="fa" dir="rtl">صفحه‌ای که دنبالش بودید پیدا نشد. <a href="/">بازگشت به خانه</a></p>
    </div>
  </main>
  <script>(function () { var e = document.getElementById('nf-path'); if (!e) return; var p = location.pathname; try { p = decodeURI(p); } catch (x) {} e.textContent = p.slice(0, 60); })();</script>
</body>
</html>
