<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Page not found · M-R-Z</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;500&family=Vazirmatn:wght@400;600&display=swap">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    .nf { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 40px 20px; position: relative; isolation: isolate; overflow: hidden; }
    .nf-code { font-family: var(--font-mono); font-size: clamp(88px, 20vw, 168px); font-weight: 500; line-height: 1; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -0.04em; margin: 0 0 12px; }
    .nf h1 { font-size: clamp(24px, 4vw, 34px); margin-bottom: 12px; }
    .nf p { color: var(--text-2); max-width: 460px; margin: 0 auto 28px; }
    .nf .term { font-family: var(--font-mono); font-size: 13px; color: var(--text-3); margin-bottom: 28px; }
    .nf .fa { font-family: var(--font-fa); color: var(--text-3); margin-top: 28px; font-size: 15px; }
    .nf-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="hero-bg" aria-hidden="true"><div class="grid-fade"></div><div class="glow glow-a"></div><div class="glow glow-b"></div></div>
    <div>
      <p class="nf-code" aria-hidden="true">404</p>
      <h1>This page doesn't exist.</h1>
      <p>The link may be broken or the page may have moved. Let's get you back on track.</p>
      <p class="term">$ cd ~ <span class="caret" aria-hidden="true"></span></p>
      <div class="nf-actions">
        <a class="btn btn-primary" href="/">Back to home</a>
        <a class="btn btn-ghost" href="https://t.me/mrzroot" target="_blank" rel="noopener">Message on Telegram</a>
      </div>
      <p class="fa" lang="fa" dir="rtl">صفحه‌ای که دنبالش هستید پیدا نشد. <a href="/" style="color:var(--accent)">بازگشت به خانه</a></p>
    </div>
  </main>
</body>
</html>
